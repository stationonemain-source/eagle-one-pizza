<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Orders · Eagle One Pizza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Libre+Franklin:wght@400;500;600;700;800&display=swap">
<style>
/* The store's side: every online order lands here live, staff move it along, and every customer becomes a record. */
:root{
  --red:#C8102E; --red-2:#A00D25; --navy:#0F2A5F; --ink:#111318; --ink-2:#3B3F48; --ink-3:#5A5F69;
  --paper:#EEF0F3; --line:#DADDE3; --open:#16703A; --amber-bg:#FFF4D6; --amber:#5A4300;
  --head:"Archivo","Arial Narrow",Arial,sans-serif; --sans:"Libre Franklin",Arial,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid #1D4FA8;outline-offset:2px}
.H{font-family:var(--head);font-weight:900;font-stretch:70%;text-transform:uppercase;line-height:.9}
.demo{background:var(--amber-bg);color:var(--amber);font:600 13.5px/1.35 var(--sans);text-align:center;padding:8px 14px}
.demo a{font-weight:800}
header{background:var(--navy);color:#fff}
.bar{max-width:1500px;margin:auto;padding:12px clamp(14px,2.4vw,28px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:40px;height:40px;border-radius:50%;background:#fff}
.brand b{font:900 20px/.95 var(--head);font-stretch:75%;text-transform:uppercase}
.brand small{display:block;font:600 12.5px/1.2 var(--sans);text-transform:none;color:#C9D4EC}
.tabs{display:flex;gap:4px;margin-left:12px}
.tabs button{min-height:38px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:#C9D4EC;font-weight:800}
.tabs button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right select{min-height:38px;border-radius:999px;border:0;padding:0 12px;font:700 14px/1 var(--sans)}
.right .lnk{min-height:38px;display:inline-flex;align-items:center;padding:0 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.4);font:700 14px/1 var(--sans);text-decoration:none;background:none;color:#fff}
.stats{max-width:1500px;margin:auto;padding:14px clamp(14px,2.4vw,28px) 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font:900 30px/1 var(--head);font-stretch:70%;color:var(--navy)}
.stat span{font:600 13px/1.3 var(--sans);color:var(--ink-3)}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
main{max-width:1500px;margin:auto;padding:14px clamp(14px,2.4vw,28px) 40px}
.board{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:12px;overflow-x:auto;align-items:start}
.col{background:#E2E5EA;border-radius:16px;padding:10px;min-height:200px}
.col h2{display:flex;justify-content:space-between;align-items:center;font:900 20px/1 var(--head);font-stretch:72%;text-transform:uppercase;padding:4px 6px 10px;color:var(--navy)}
.col h2 span{font:800 13px/1 var(--sans);background:#fff;border-radius:999px;padding:4px 9px}
.col .none{color:var(--ink-3);font-size:14px;padding:10px 6px}
.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid var(--line);display:grid;gap:6px}
.card.fresh{animation:fresh 2.4s ease-out}
@keyframes fresh{0%{box-shadow:0 0 0 4px rgba(200,16,46,.6)}100%{box-shadow:0 0 0 0 rgba(200,16,46,0)}}
.card .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .no{font:900 22px/1 var(--head);font-stretch:70%}
.card .ago{font:600 13px/1 var(--sans);color:var(--ink-3)}
.tag{display:inline-flex;align-items:center;font:800 12.5px/1 var(--sans);border-radius:999px;padding:5px 8px;background:#EEF1F7;color:var(--navy)}
.tag.del{background:#FBECEE;color:var(--red-2)}
.tag.first{background:#E7F4EC;color:var(--open)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.who{font:800 15px/1.3 var(--sans)}
.who a{font-weight:600;color:var(--ink-2);text-decoration:none}
.card ul{list-style:none;margin:0;padding:0;border-top:1px solid #EEF0F3}
.card li{padding:6px 0;border-bottom:1px solid #EEF0F3;font-size:14px}
.card li b{font-weight:800}
.card li small{display:block;color:var(--ink-2);font-size:13px;line-height:1.35}
.card .note{font-size:13.5px;background:#FFF7E6;border-radius:8px;padding:6px 8px}
.card .addr{font-size:13.5px;color:var(--ink-2)}
.card .tot{display:flex;justify-content:space-between;font-weight:800}
.card .acts{display:flex;gap:6px}
.card .acts button{flex:1;min-height:42px;border-radius:999px;border:0;background:var(--navy);color:#fff;font-weight:800}
.card .acts button.ghost{flex:none;background:#fff;color:var(--ink);border:1.5px solid var(--line);padding:0 12px}
.sent{font:600 12.5px/1.3 var(--sans);color:var(--open)}
table{width:100%;min-width:720px;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #EEF0F3;font-size:14px;vertical-align:top}
th{font:800 13px/1.2 var(--sans);color:var(--ink-3);background:#F7F8FA}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hist td{background:#FAFBFC}
.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--ink-2)}
.empty a{font-weight:800;color:var(--red-2)}
.tblwrap{overflow-x:auto}
</style>
</head>
<body>
<p class="demo">Demo order board. It shows orders placed in the demo on this device. In the live version every store sees its own orders here and each customer is saved to Eagle One&rsquo;s contact list. <a href="./" target="_blank" rel="noopener">Place a test order</a></p>
<header>
  <div class="bar">
    <a class="brand" href="../"><img src="../img/badge.png" width="120" height="118" alt=""><b>Eagle One<small>Online orders</small></b></a>
    <div class="tabs" role="group" aria-label="View">
      <button type="button" data-v="board" aria-pressed="true">Orders</button>
      <button type="button" data-v="people" aria-pressed="false">Customers</button>
    </div>
    <div class="right">
      <select id="sf" aria-label="Store"></select>
      <button type="button" class="lnk" id="clear">Clear demo orders</button>
    </div>
  </div>
</header>
<div class="stats" id="stats"></div>
<main>
  <section id="v-board"><div class="board" id="board"></div></section>
  <section id="v-people" hidden><div class="tblwrap" id="people"></div></section>
</main>

<script src="data.js"></script>
<script>
(() => {
const {S, getOrders, setStatus, putOrders, onChange, money, esc} = window.EOP;
const $ = id => document.getElementById(id);
const COLS = [['new','New'],['oven','In the oven'],['ready','Ready'],['done','Done']];
const NEXT = {new:['oven','Start it'], oven:['ready','Mark ready'], ready:['done', null]};
let store = 'all', view = 'board', seen = new Set(getOrders().map(o => o.no)), open = null;
$('sf').innerHTML = '<option value="all">All seven stores</option>' + S.map(s => `<option value="${s.k}">${esc(s.t)}</option>`).join('');
$('sf').addEventListener('change', e => { store = e.target.value; draw(); });
document.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => {
  view = b.dataset.v; document.querySelectorAll('[data-v]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  $('v-board').hidden = view !== 'board'; $('v-people').hidden = view !== 'people'; draw();
}));
$('clear').addEventListener('click', () => { if (confirm('Clear every demo order on this device?')) { putOrders([]); draw(); } });
const ago = ts => { const m = Math.round((Date.now() - ts) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.floor(m / 60) + ' h ago'; };
const fmtPhone = p => p.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
function card(o, fresh){
  const nx = NEXT[o.status];
  const txt = o.status === 'ready' ? (o.optin ? `<p class="sent">Live version texts ${esc(o.name.split(' ')[0])}: &ldquo;Your Eagle One order is ready.&rdquo;</p>` : '<p class="sent" style="color:#5A5F69">No texts: customer did not opt in.</p>') : '';
  return `<article class="card${fresh ? ' fresh' : ''}">
    <div class="r1"><span class="no">#${o.no}</span><span class="ago">${ago(o.ts)}</span></div>
    <div class="tags"><span class="tag${o.how === 'del' ? ' del' : ''}">${o.how === 'del' ? 'Delivery' : 'Pick-up'} &middot; ${esc(o.when)}</span>${store === 'all' ? `<span class="tag">${esc(o.storeName)}</span>` : ''}${o.firstOrder ? '<span class="tag first">First order</span>' : ''}</div>
    <p class="who" style="margin:0">${esc(o.name)} &middot; <a href="tel:+1${o.phone}">${fmtPhone(o.phone)}</a></p>
    ${o.addr ? `<p class="addr" style="margin:0">${esc(o.addr)}</p>` : ''}
    <ul>${o.lines.map(l => `<li><b>${l.qty} &times; ${esc(l.name)}</b><small>${esc(l.detail)}</small></li>`).join('')}</ul>
    ${o.notes ? `<p class="note" style="margin:0">${esc(o.notes)}</p>` : ''}
    <div class="tot"><span>${esc(o.pay)}</span><span>${money(o.totals.total)}</span></div>
    ${txt}
    ${nx ? `<div class="acts">${nx[1] ? `<button type="button" data-go="${o.no}" data-to="${nx[0]}">${nx[1]}</button>` : `<button type="button" data-go="${o.no}" data-to="done">${o.how === 'del' ? 'Out for delivery' : 'Picked up'}</button>`}</div>` : ''}
  </article>`;
}
function draw(){
  const all = getOrders().filter(o => store === 'all' || o.store === store);
  const today = all.filter(o => new Date(o.ts).toDateString() === new Date().toDateString());
  const rev = today.reduce((a,o) => a + o.totals.total, 0);
  const custs = new Set(all.map(o => o.phone));
  $('stats').innerHTML = [
    [today.length, 'orders today'], [money(rev), 'online sales today'], [today.length ? money(rev / today.length) : '$0.00', 'average order'], [custs.size, 'customers on file']
  ].map(([b,s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('');
  if (view === 'board') {
    if (!all.length) { $('board').innerHTML = `<div class="empty" style="grid-column:1/-1">No orders yet. <a href="./" target="_blank" rel="noopener">Place a test order</a> in another tab and watch it land here.</div>`; return; }
    $('board').innerHTML = COLS.map(([k,label]) => { const os = all.filter(o => o.status === k).sort((a,b) => k === 'done' ? b.ts - a.ts : a.ts - b.ts);
      return `<div class="col"><h2>${label}<span>${os.length}</span></h2>${os.length ? os.map(o => card(o, !seen.has(o.no))).join('') : '<p class="none">Nothing here.</p>'}</div>`; }).join('');
    all.forEach(o => seen.add(o.no));
  } else {
    const by = {};
    all.forEach(o => { const c = by[o.phone] || (by[o.phone] = {name:o.name, phone:o.phone, email:'', orders:[], optin:false, store:o.storeName}); c.orders.push(o); c.name = o.name; if (o.email) c.email = o.email; c.optin = c.optin || o.optin; c.store = o.storeName; });
    const rows = Object.values(by).sort((a,b) => b.orders[b.orders.length-1].ts - a.orders[a.orders.length-1].ts);
    if (!rows.length) { $('people').innerHTML = `<div class="empty">No customers yet. Every online order adds or updates one here.</div>`; return; }
    $('people').innerHTML = `<table><thead><tr><th>Customer</th><th>Phone</th><th>Orders</th><th>Spent</th><th>Last order</th><th>Usual store</th><th>Texts</th></tr></thead><tbody>${
      rows.map(c => { const last = c.orders[c.orders.length-1], spent = c.orders.reduce((a,o) => a + o.totals.total, 0);
        return `<tr><td><button type="button" data-p="${c.phone}" style="border:0;background:none;padding:0;font-weight:800;text-decoration:underline">${esc(c.name)}</button>${c.email ? `<br><small>${esc(c.email)}</small>` : ''}</td><td class="n"><a href="tel:+1${c.phone}">${fmtPhone(c.phone)}</a></td><td class="n">${c.orders.length}</td><td class="n">${money(spent)}</td><td>${ago(last.ts)} &middot; #${last.no}</td><td>${esc(c.store)}</td><td>${c.optin ? 'Yes' : 'No'}</td></tr>${
          open === c.phone ? c.orders.slice().reverse().map(o => `<tr class="hist"><td colspan="7">#${o.no} &middot; ${new Date(o.ts).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})} &middot; ${o.how === 'del' ? 'Delivery' : 'Pick-up'} &middot; ${esc(o.storeName)} &middot; ${o.lines.map(l => l.qty + ' × ' + esc(l.name)).join(', ')} &middot; <b>${money(o.totals.total)}</b></td></tr>`).join('') : ''}`; }).join('')
    }</tbody></table>`;
  }
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { setStatus(+g.dataset.go, g.dataset.to); draw(); }
  const p = e.target.closest('[data-p]'); if (p) { open = open === p.dataset.p ? null : p.dataset.p; draw(); }
});
onChange(draw); draw(); setInterval(draw, 30000);
})();
</script>
</body>
</html>
